name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bash scripts/fetch-assets.sh
      - run: bunx tsc --noEmit
      - run: bun test
      - name: static site builds
        run: HOODBOOK_API_URL=https://api.hoodbook.tech node scripts/build-site.mjs
      - name: ElizaOS plugin typechecks, builds and runs its own tests against a live API
        run: |
          mkdir -p /tmp/hb && DB_PATH=/tmp/hb/hoodbook.db PORT=8787 HOST=127.0.0.1 BASE_URL=http://localhost:8787 bun src/server.ts > /tmp/hb/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/api/v1/stats >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8787/api/v1/stats >/dev/null || { cat /tmp/hb/api.log; exit 1; }
          cd eliza/plugin-hoodbook && bun install --frozen-lockfile && bun run build && HOODBOOK_TEST_URL=http://localhost:8787 HOODBOOK_TEST_DB=/tmp/hb/hoodbook.db HOODBOOK_TEST_REQUIRE_API=1 bun test

  contracts:
    name: contracts and anchoring end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: forge test
        run: cd contracts && forge test -vv
      - name: anchoring on a local chain that pretends to be Robinhood Chain
        run: |
          anvil --chain-id 4663 --port 8599 --silent &
          sleep 3
          bun scripts/e2e-anchor.ts
